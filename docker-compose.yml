x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16
    container_name: postgres_db
    restart: always
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: always
    logging: *default-logging
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      LAB_NAME: ${LAB_NAME}
      LAB_EMAIL: ${LAB_EMAIL}
      LAB_ADDRESS: ${LAB_ADDRESS}
      LAB_PHONE: ${LAB_PHONE}
      LAB_LOGO_TEXT: ${LAB_LOGO_TEXT}
      LAB_LOGO_URL: ${LAB_LOGO_URL}
    # Nessuna porta pubblicata: il backend è raggiungibile solo dalla rete interna della
    # compose, dove lo contatta nginx del frontend. Esporlo sull'host significherebbe
    # aggirare nginx, e con esso l'unico punto in cui l'IP reale del client è affidabile.
    volumes:
      - ${BACKUP_HOST_DIR}:/app/backups
      - ./ops/update:/app/update-signal
      - backend_data:/app/data
      # Senza questo volume i log azioni utente stanno nel layer scrivibile del
      # container, che viene ricreato a ogni `up --build`: si perderebbero a ogni
      # aggiornamento automatico.
      - backend_logs:/app/logs
    # `exec` è necessario, non stilistico: senza, `sh` resta PID 1 e non inoltra SIGTERM
    # al processo Node, quindi allo spegnimento il container verrebbe ucciso con SIGKILL
    # e l'arresto pulito in src/index.ts non verrebbe mai eseguito. Con `exec` Node
    # sostituisce la shell e riceve il segnale direttamente.
    # (L'echo di DATABASE_URL è stato rimosso: stampava la password del database nei log.)
    command: >-
      sh -c 'node migrate.js && exec node dist/src/index.js'
    # Lo shutdown applicativo si dà 10s di tempo: la finestra di Docker deve essere più
    # ampia, altrimenti SIGKILL arriva prima che finisca.
    stop_grace_period: 30s
    healthcheck:
      # wget è fornito da busybox nell'immagine alpine, nessun pacchetto aggiuntivo.
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      # `restart: always` copre il processo morto; l'healthcheck serve per il processo vivo
      # ma bloccato, e per far partire il frontend solo quando le API rispondono davvero.
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_LOGO_URL: /assets/logo.jpg
    container_name: frontend
    restart: always
    logging: *default-logging
    # Nessuna porta pubblicata sull'host: si entra solo dal dominio pubblico, attraverso
    # cloudflared, che raggiunge questo container dalla rete interna della compose. Per un
    # accesso di emergenza dalla LAN (tunnel non funzionante) riaggiungere qui
    # temporaneamente `ports: ["80:80"]` e rifare `docker compose up -d`.
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy

  # Espone il frontend sul dominio pubblico senza aprire nessuna porta in ingresso: è
  # cloudflared ad aprire la connessione verso Cloudflare, non il contrario. È questo che
  # permette di convivere con l'altro servizio che occupa già 80/443 sull'IP pubblico.
  #
  # Il tunnel è gestito localmente: credenziali e ingress stanno in ops/cloudflared sulla
  # VM, generati da scripts/install-tunnel.sh. Il dominio si trova in config.yml, quindi
  # cambiarlo è una modifica di configurazione e un riavvio, senza ricostruire immagini.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: always
    logging: *default-logging
    # --no-autoupdate: l'aggiornamento va col resto dello stack (`up --build` ripesca
    # l'immagine), non a sorpresa dentro un container in esecuzione.
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./ops/cloudflared:/etc/cloudflared:ro
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  postgres_data:
  backend_data:
  backend_logs:
