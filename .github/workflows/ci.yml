name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Allineato ai Dockerfile (node:24-*): la CI deve girare sullo stesso
          # runtime della produzione. Da alzare insieme alle immagini, non da solo.
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    name: Backend (lint, format, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Allineato ai Dockerfile (node:24-*): la CI deve girare sullo stesso
          # runtime della produzione. Da alzare insieme alle immagini, non da solo.
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # I job qui sopra compilano nella working copy, dove ogni file è presente per
  # definizione: non accorgerebbero che il Dockerfile non copia un file di config
  # nuovo. Questo job costruisce le immagini reali con lo stesso comando usato
  # dall'aggiornamento automatico (scripts/update-server.sh), quindi una build di
  # produzione rotta fallisce qui invece che sul server.
  images:
    name: Production images (docker compose build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # docker compose interpola le variabili del compose file anche per `build`.
      # .env.example le fornisce tutte senza introdurre segreti reali, e di
      # riflesso verifica che resti allineato a docker-compose.yml.
      - run: docker compose --env-file .env.example build
